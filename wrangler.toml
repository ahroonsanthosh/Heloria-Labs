# Cloudflare serves the site straight from docs/ (built ahead of time by python3 tools/build.py), so there is no build
# step: every push to main deploys it. docs/_headers sets the security headers and caching; docs/404.html is the 404 page.
name = "heloria-labs"
compatibility_date = "2026-10-01"

[assets]
directory = "./docs"
not_found_handling = "404-page"
